[package]
name = "sudo-sacrifice"
version = "0.1.0"
edition = "2024"
description = "sudo sacrifice: coding agents sacrifice software at their altars to summon subagents. A Sacrifice-like built with Bevy."
license = "MIT"

[dependencies]
bevy = { version = "0.19.1", features = ["wayland"] }

[profile.dev]
opt-level = 1

# Bevy is far faster when optimized, even in dev builds.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
