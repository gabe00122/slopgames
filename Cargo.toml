[package]
name = "voxel-raid"
version = "0.1.0"
edition = "2021"
description = "A voxel extraction shooter: Minecraft-style destructible worlds meet Tarkov-style raids."
license = "MIT"

[dependencies]
# Rendering / windowing. wgpu is pinned exactly; egui-wgpu 0.36 targets wgpu 30.
wgpu = "=30.0.1"
winit = "=0.30.13"
glam = { version = "=0.33.11", features = ["bytemuck"] }

# Immediate-mode UI
egui = "=0.36.2"
egui-wgpu = "=0.36.2"
egui-winit = "=0.36.2"

bytemuck = { version = "1.25", features = ["derive"] }
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
png = "0.18"

[profile.dev]
opt-level = 1

# Dependencies (wgpu, naga, egui) are much faster when optimized even in dev.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
debug = false
